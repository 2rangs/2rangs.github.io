# Simple workflow for deploying Vite/React build to GitHub Pages
name: Deploy Vite site to Pages

on:
  push:
    branches: ["main"]
  # 웹 에디터로 발행한 글은 블로그에 바로 보이지만, 검색엔진과 링크 미리보기가 읽는
  # 글별 HTML과 썸네일은 빌드 때 만들어진다. 그래서 6시간마다 다시 빌드한다.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 개인 프로젝트 사이트 → /portfolio/<프로젝트>/
      # 브랜치는 저장소 변수(Settings → Variables)로 바꿀 수 있다. 기본은 main.
      - name: Checkout Pokestra
        uses: actions/checkout@v4
        with:
          repository: 2rangs/Pokestra
          ref: ${{ vars.POKESTRA_REF || 'main' }}
          path: _portfolio/Pokestra

      - name: Checkout pokebattle-engine
        uses: actions/checkout@v4
        with:
          repository: 2rangs/pokebattle-engine
          ref: ${{ vars.POKEBATTLE_ENGINE_REF || 'main' }}
          path: _portfolio/pokebattle-engine

      - name: Build portfolio project sites
        run: bash scripts/build-portfolio.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
